<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {

        }
        nav ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

nav ul li {
  position: relative;
  display: inline-block;
}

nav a {
  text-decoration: none;
  color: #333;
  transition: color 0.3s ease-in-out;
  display: block;
  padding: 10px;
}

.submenu {
  position: absolute;
  top: 100%;
  left: 0;
  background-color: #fff;
  border: 1px solid #ddd;
  border-radius: 5px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  padding: 10px;
  min-width: 150px;
  visibility: hidden;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.3s ease-in-out;
}

nav ul li:hover .submenu {
  visibility: visible;
  opacity: 1;
  transform: translateY(0);
}

.submenu li {
  margin-bottom: 10px;
}

.submenu li a {
  color: #333;
  padding: 5px;
}

.submenu li a:hover {
  color: #4CAF50;
  background-color: #4CAF50;
  width: 100%;
}


    </style>
</head>
<body>
    <nav>
        <div>
          <ul>
            <li>
              <a href="#">Menu Item</a>
              <ul class="submenu">
                <li><a href="#">Submenu Item 1</a></li>
                <li><a href="#">Submenu Item 2</a></li>
                <li><a href="#">Submenu Item 3</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </nav>
      
      
      
</body>
</html>
