    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signin Page</title>
  <link rel="stylesheet" href="">
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Arial', sans-serif;
}

body {
  background: #ddd;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 800px;
  height: 450px;
  display: flex;
  background: #fff;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  border-radius: 10px;
  overflow: hidden;
}

.signin-box {
  width: 50%;
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.signin-box h2 {
  font-size: 32px;
  margin-bottom: 20px;
}

.signin-box input {
  padding: 12px;
  margin: 10px 10px;
  border: none;
  background: #f2f2f2;
  border-radius: 5px;
  font-size: 16px;
}

.signin-box button {
  padding: 12px;
  margin-top: 10px;
  background-color: #0a9b61;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  cursor: pointer;
}

.or {
  text-align: center;
  margin: 20px 0 10px;
  color: #086af3;
  cursor: pointer;
}



.welcome-box {
  width: 50%;
  background: linear-gradient(to left, #6464df, #07a06d);
  color: white;
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}

.welcome-box h2 {
  font-size: 28px;
  margin-bottom: 20px;
}

.welcome-box p {
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 30px;
}

.signup-btn {
  display: inline-block;
  background: rgba(255, 255, 255, 0.2);
  padding: 10px 20px;
  color: white;
  border-radius: 25px;
  text-decoration: none;
  transition: background 0.3s ease;
}

.signup-btn:hover {
  background: rgba(255, 255, 255, 0.3);
}


  </style>
</head>
<body>
  <div class="container">
    <div class="signin-box">
      <h2 align="center">Login</h2>
      <input type="text" placeholder="Login Required" required >
      <input type="password" placeholder="******" required >
      <button>Signin</button>
      <p class="or">or signin with</p>
      
      
       
      
    </div>
    <div class="welcome-box">
      <h2>Login !</h2>
      <p>Welcome back! We are so happy to have you here. It's great to see you again. Login to access the all features</p>
      <a href="" class="signup-btn">No account yet? Signup.</a>
    </div>
  </div>
</body>
</html>

</body>
</html>
